<style>
:root{--bg:#0a0303;--card:#1a0606;--red:#e0262b;--red2:#ff4a4a;--deep:#6e0d10;--text:#f6e9e6;--mut:#b99c98;

filter:drop-shadow(0 2px 0 #300)}
.tag{display:inline-block;margin-top:2px;font-size:15px;font-weight:800;font-style:italic;color:var(--red2);letter-spacing:3px;text-transform:uppercase}
.sub{margin:6px 0 12px;color:var(--mut);font-size:13px}
ul{list-style:none;margin:0 0 14px;padding:0;text-align:left}
li{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:7px;background:rgba(224,38,43,.07);
border:1px solid #4a1214;border-radius:12px;font-size:14px;opacity:0;animation:rise .6s ease forwards}
li{cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,border-color .25s,box-shadow .25s}
li:hover,li:active,li.tap,li.auto{transform:scale(1.04) translateX(4px);background:rgba(224,38,43,.18);border-color:var(--red);box-shadow:0 0 16px rgba(224,38,43,.35)}
li span{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
li:hover span,li:active span,li.tap span,li.auto span{transform:scale(1.2) rotate(-8deg)}
li:nth-child(1){animation-delay:.3s}li:nth-child(2){animation-delay:.5s}li:nth-child(3){animation-delay:.7s}li:nth-child(4){animation-delay:.9s}
li span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:12px;box-shadow:0 0 10px rgba(224,38,43,.6)}
.btn{display:block;width:100%;padding:13px;border:0;position:relative;overflow:hidden;border-radius:999px;cursor:pointer;text-decoration:none;
background:linear-gradient(90deg,var(--deep),var(--red),var(--red2));background-size:200% 100%;color:#fff;
font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;animation:pulse 2s infinite,shine 3s linear infinite}
.btn:active{transform:scale(.95)}
.btn.go{animation:pop .5s ease,shine 3s linear infinite}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.92)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.foot{margin-top:9px;font-size:11px;color:var(--mut)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,38,43,.6)}70%{box-shadow:0 0 0 16px rgba(224,38,43,0)}100%{box-shadow:0 0 0 0 rgba(224,38,43,0)}}
